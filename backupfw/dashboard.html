<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>백업 현황</title>
<style>
:root{
  --paper:#F6F7F4; --ink:#1B2430; --ink-2:#4A5462; --muted:#7A8390;
  --line:#D9DDD6; --line-2:#E8EBE5; --panel:#fff; --code:#EEF1EC;
  --crit:#A6423A; --crit-bg:#F7E4E2; --warn:#9A7A14; --warn-bg:#F7EFD2;
  --ok:#3E7B5A; --ok-bg:#E2EEE6; --accent:#2F6F8F;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#151A20; --ink:#E6E9EC; --ink-2:#B5BDC6; --muted:#8892A0;
  --line:#2C343E; --line-2:#232A33; --panel:#1C232B; --code:#11161B;
  --crit:#E08A82; --crit-bg:#3A1F1C; --warn:#E3C25A; --warn-bg:#3A3117;
  --ok:#8CC4A2; --ok-bg:#1E3229; --accent:#7FB6D1;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);padding:0 20px 60px;
  font:15px/1.6 "IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
.wrap{max-width:960px;margin:0 auto}
code,.mono{font-family:"IBM Plex Mono",Consolas,D2Coding,monospace;font-size:12.5px}
header{padding:36px 0 8px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:26px;margin:0;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
h2{font-size:18px;margin:44px 0 0;padding-top:18px;border-top:1px solid var(--line)}
.hint{color:var(--ink-2);font-size:13.5px;margin:8px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.tile b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.crit b{color:var(--crit)} .tile.warn b{color:var(--warn)} .tile.ok b{color:var(--ok)}
.gap{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.pill{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:3px;text-align:center;
  align-self:start;white-space:nowrap}
.pill.critical{background:var(--crit-bg);color:var(--crit)}
.pill.warning{background:var(--warn-bg);color:var(--warn)}
.pill.info{background:var(--code);color:var(--muted)}
.gap .kind{font-weight:600}
.gap .where{color:var(--accent);font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.gap .detail{color:var(--ink-2);font-size:13.5px}
table{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-size:12px;letter-spacing:.04em;color:var(--muted);border-bottom:1px solid var(--line);
  font-weight:600;white-space:nowrap}
td.st span{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:3px}
.s-success{background:var(--ok-bg);color:var(--ok)}
.s-blocked{background:var(--warn-bg);color:var(--warn)}
.s-failed,.s-none{background:var(--crit-bg);color:var(--crit)}
.s-running{background:var(--code);color:var(--muted)}
.empty{color:var(--ok);background:var(--ok-bg);border-radius:4px;padding:14px 16px;margin-top:14px}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);
  color:var(--muted);font-size:12.5px}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>백업 현황</h1>
    <span class="sub" id="ts"></span>
  </header>
  <p class="hint">정책(있어야 할 것)과 실행 기록(실제 있었던 것)을 맞대어 계산한다.
    백업 작업이 등록되어 있다는 것과 복구할 수 있다는 것은 별개다.</p>

  <div class="tiles" id="tiles"></div>

  <h2>안 되고 있는 것</h2>
  <div id="gaps"></div>

  <h2>서비스</h2>
  <div id="services"></div>

  <h2>최근 실행</h2>
  <div id="runs"></div>

  <footer>
    JSON — <a href="/gaps">/gaps</a> · <a href="/services">/services</a> · <a href="/runs">/runs</a>
    <br>5초마다 새로 읽는다.
  </footer>
</div>

<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function statusPill(s){
  const k = s || "none";
  const label = {success:"성공",blocked:"차단",failed:"실패",running:"실행 중",none:"기록 없음"}[k] || k;
  return `<span class="s-${esc(k)}">${esc(label)}</span>`;
}

async function load(){
  const [gaps, services, runs] = await Promise.all([
    fetch("/gaps").then(r=>r.json()),
    fetch("/services").then(r=>r.json()),
    fetch("/runs").then(r=>r.json())
  ]);

  document.getElementById("ts").textContent = services.generated_at || "";

  const crit = gaps.gaps.filter(g=>g.severity==="critical").length;
  const warn = gaps.gaps.filter(g=>g.severity==="warning").length;
  const verified = services.services.flatMap(s=>s.scheduled).filter(x=>x.verified==="pass").length;
  const scheduled = services.services.flatMap(s=>s.scheduled).length;
  document.getElementById("tiles").innerHTML = `
    <div class="tile crit"><b>${crit}</b><span>즉시 조치</span></div>
    <div class="tile warn"><b>${warn}</b><span>확인 필요</span></div>
    <div class="tile ok"><b>${verified} / ${scheduled}</b><span>복구까지 확인된 대상</span></div>
    <div class="tile"><b>${services.services.length}</b><span>정책이 있는 서비스</span></div>`;

  document.getElementById("gaps").innerHTML = gaps.gaps.length === 0
    ? `<div class="empty">공백 없음.</div>`
    : gaps.gaps.map(g=>`
      <div class="gap">
        <span class="pill ${esc(g.severity)}">${esc(g.kind)}</span>
        <div>
          <div class="where">${esc(g.service)}${g.item ? "/" + esc(g.item) : ""}</div>
          <div class="detail">${esc(g.detail)}</div>
        </div>
      </div>`).join("");

  document.getElementById("services").innerHTML = `
    <table>
      <tr><th>서비스</th><th>담당 역할</th><th>판정</th><th>스케줄</th><th>최근</th><th>검증</th></tr>
      ${services.services.map(s=>{
        const j = Object.entries(s.judgements).map(([k,v])=>`${esc(k)} ${v}`).join(" · ");
        const owners = s.owners.length ? esc(s.owners.join(", ")) : "<b>배정 없음</b>";
        if(!s.scheduled.length){
          return `<tr><td>${esc(s.service)}</td><td>${esc(s.owner_role)}<br><span class="sub">${owners}</span></td>
            <td>${j}</td><td colspan="3" class="sub">실행이 생기는 항목 없음</td></tr>`;
        }
        return s.scheduled.map((x,i)=>`<tr>
          ${i===0?`<td rowspan="${s.scheduled.length}">${esc(s.service)}</td>
                   <td rowspan="${s.scheduled.length}">${esc(s.owner_role)}<br><span class="sub">${owners}</span></td>
                   <td rowspan="${s.scheduled.length}">${j}</td>`:""}
          <td class="mono">${esc(x.item)} · ${esc(x.schedule)}</td>
          <td class="st">${statusPill(x.last_status)}</td>
          <td class="st">${x.verified==="pass"?'<span class="s-success">통과</span>':'<span class="s-none">미검증</span>'}</td>
        </tr>`).join("");
      }).join("")}
    </table>`;

  document.getElementById("runs").innerHTML = `
    <table>
      <tr><th>시작</th><th>종류</th><th>대상</th><th>상태</th><th>backup_id</th><th>비고</th></tr>
      ${runs.runs.slice(0,20).map(r=>`<tr>
        <td class="mono">${esc((r.started_at||"").replace("T"," ").replace("+00:00",""))}</td>
        <td>${r.kind==="restore_test"?"복구 시험":"백업"}</td>
        <td class="mono">${esc(r.policy.service)}/${esc(r.policy.item)}</td>
        <td class="st">${statusPill(r.status)}</td>
        <td class="mono">${esc(r.backup_id||"")}</td>
        <td class="detail">${esc(r.error||(r.retention&&r.retention.deleted&&r.retention.deleted.length?`보존 정리 ${r.retention.deleted.length}건`:""))}</td>
      </tr>`).join("")}
    </table>`;
}

load();
setInterval(load, 5000);
</script>
</body>
</html>
