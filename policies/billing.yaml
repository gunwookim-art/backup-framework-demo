# 원본이 옮겨갔는데 정책이 따라가지 못한 서비스.
#
# locator 는 billing-legacy.db 를 가리키지만 실제 서비스는 billing.db 를 쓴다.
# 서버 이전이나 경로 변경 뒤에 흔히 남는 상태다.
#
# 확인할 것:
#   - 실행기가 B1 에서 차단한다 (blocked). 어댑터를 호출하지 않는다
#   - 보존 정리도 하지 않는다 → 기존 백업이 그대로 남는다
#   - 흔한 구현은 삭제를 먼저 하기 때문에, 이 상황에서 백업은 없고 삭제만 완료된다

service: billing
owner_role: team-billing
tier: business

items:
  - name: database
    kind: data
    judgement: backup
    reason: "청구 원장. 유실 시 재생성 불가"
    source:
      type: sqlite
      locator: "file://demo-data/billing-legacy.db"   # ← 실제 원본은 billing.db
    adapter: sqlite@1
    schedule: "0 3 * * *"
    retention: {keep_days: 3, min_copies: 1}
    target: "backend://local-primary/billing/database"
    objectives: {rpo: 24h, rto: 4h}
    verify:
      data:
        - builtin: integrity-check
        - sql: "select count(*) from invoices"

  - name: invoice-pdf
    kind: data
    judgement: hold
    reason: "원본이 외부 저장소에 있는지 확인 필요"
    review_by: 2026-11-15
    review_role: team-billing
