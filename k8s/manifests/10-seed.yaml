# 백업 대상 원본을 PVC 에 만든다.
#
# demo-data 를 이미지에 굽지 않는 이유: 백업 대상은 앱의 데이터이지 runner 의 일부가
# 아니다. 이미지에 넣으면 파드를 다시 만들 때마다 원본이 초기화되어, 백업이 실제로
# 무언가를 지키고 있는지 확인할 수 없다.
#
# 일부러 만들지 않는 것: demo-data/billing-legacy.db
#   policies/billing.yaml 이 그 경로를 가리킨다. 없어야 B1 차단 시나리오가 성립한다.
#
# 적용:  kubectl apply -f k8s/manifests/10-seed.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-seed-script
  namespace: backup-system
data:
  seed.py: |
    """백업 대상 원본 생성. 이미 있으면 덮어쓰지 않는다 (재실행 안전)."""
    import sqlite3
    from pathlib import Path

    DATA = Path("/app/demo-data")
    STORE = Path("/store")

    def sqlite_table(path: Path, ddl: str, insert: str, rows: list) -> None:
        if path.exists():
            print(f"  유지  {path} (이미 있음)")
            return
        con = sqlite3.connect(path)
        con.execute(ddl)
        con.executemany(insert, rows)
        con.commit()
        n = con.execute(f"select count(*) from {ddl.split()[2]}").fetchone()[0]
        con.close()
        print(f"  생성  {path}  {n}행")

    DATA.mkdir(parents=True, exist_ok=True)

    # policies/orders.yaml 의 verify: select count(*) from orders
    sqlite_table(
        DATA / "orders.db",
        "CREATE TABLE orders (id integer primary key, customer text, total integer)",
        "INSERT INTO orders VALUES (?,?,?)",
        [(i, f"customer-{i:03d}", i * 1000) for i in range(1, 121)],
    )

    # policies/billing.yaml 의 verify: select count(*) from invoices
    # 정책의 locator 는 billing-legacy.db 를 가리키므로 이 파일에는 닿지 않는다.
    sqlite_table(
        DATA / "billing.db",
        "CREATE TABLE invoices (id integer primary key, amount integer)",
        "INSERT INTO invoices VALUES (?,?)",
        [(i, i * 250) for i in range(1, 61)],
    )

    cfg = DATA / "orders-config"
    cfg.mkdir(parents=True, exist_ok=True)
    for name, body in (
        ("app.yaml", "replicas: 3\ntimeout: 30s\n"),
        ("routes.conf", "location /orders { proxy_pass http://orders; }\n"),
    ):
        p = cfg / name
        if p.exists():
            print(f"  유지  {p}")
        else:
            p.write_text(body, encoding="utf-8")
            print(f"  생성  {p}")

    for sub in ("primary", "offsite"):
        (STORE / sub).mkdir(parents=True, exist_ok=True)
        print(f"  준비  {STORE / sub}")

    legacy = DATA / "billing-legacy.db"
    print(f"\n  billing-legacy.db 존재 여부: {legacy.exists()}  (False 여야 B1 차단이 성립)")
    print("  완료")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: backup-seed
  namespace: backup-system
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: backup-runner
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001            # PVC 를 10001 이 쓸 수 있게
      containers:
        - name: seed
          image: backup-runner:0.1.0
          imagePullPolicy: IfNotPresent      # 로컬 import 이미지 — 레지스트리를 보지 않는다
          command: ["python", "/seed/seed.py"]
          volumeMounts:
            - {name: seed, mountPath: /seed, readOnly: true}
            - {name: data, mountPath: /app/demo-data, subPath: demo-data}
            - {name: data, mountPath: /store, subPath: store}
      volumes:
        - name: seed
          configMap: {name: backup-seed-script}
        - name: data
          persistentVolumeClaim: {claimName: backup-data}
