# 이 파일은 기본값일 뿐이다.
# 실제 values 는 policies/<service>.yaml — 서비스 담당자가 쓰는 정책 파일이다.
#
#   helm template backup-orders k8s/charts/backup-runner \
#     -n backup-system -f policies/orders.yaml
#
# 정책 파일과 Helm values 가 같은 파일이므로, 정책에서 실행으로 가는 사이에
# 사람도 봇도 무언가를 다시 쓰지 않는다.
#
# global 아래 값들은 차트 동작용이다. 정책 파일에는 없고, 여기서만 온다.
# ConfigMap 으로 굽는 정책 본문에서는 omit 으로 빠진다.

global:
  # k3s 에 `ctr images import` 로 넣은 로컬 이미지. 레지스트리를 보지 않는다.
  runnerImage: backup-runner:0.1.0
  imagePullPolicy: IfNotPresent
  # k8s/manifests/00-base.yaml 이 만드는 것들
  storageConfigMap: backup-storage-config
  dataClaim: backup-data

service: ""
owner_role: ""
tier: business
items: []
