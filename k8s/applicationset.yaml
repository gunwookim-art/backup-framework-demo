# 정책 파일 하나 = Application 하나.
#
# 핵심은 CI 가 렌더 결과를 Git 에 되쓰지 않는다는 점이다.
# Argo CD 가 정책 파일을 Helm values 로 직접 읽어 CronJob 을 만든다.
#
#   policies/orders.yaml  ──발견──▶  Application backup-orders
#                                        │ helm template
#                                        ▼
#                          judgement: backup 항목마다 CronJob
#
# 정책 파일이 없으면 Application 도 없다 → 미등록 서비스가 배포 화면에서도 보인다.
#
# 전제: k8s/manifests/00-base.yaml 이 먼저 적용되어 있어야 한다.
#       (네임스페이스 · ServiceAccount · PVC · storage ConfigMap)

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: backup-policies
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/gunwookim-art/backup-framework-demo
        revision: main
        files:
          # `_template.yaml` 은 예시라 제외한다. 그대로 두면 service 가 비어
          # 이름 없는 Application 이 생긴다.
          - path: "policies/*.yaml"
          - path: "policies/_template.yaml"
            exclude: true

  template:
    metadata:
      name: "backup-{{ service }}"        # 정책 파일의 service 필드
    spec:
      project: default
      source:
        repoURL: https://github.com/gunwookim-art/backup-framework-demo
        targetRevision: main
        # 차트는 저장소 안 k8s/charts/backup-runner 에 있다.
        path: k8s/charts/backup-runner
        helm:
          valueFiles:
            # 차트 기준 상대 경로. k8s/charts/backup-runner 에서 세 단계 올라가면
            # 저장소 루트다. {{ path }} 는 정책 파일이 들어 있는 디렉터리(policies),
            # {{ path.filename }} 은 파일 이름(orders.yaml).
            - "../../../{{ path }}/{{ path.filename }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: backup-system
      syncPolicy:
        automated:
          prune: true                     # 정책 파일을 지우면 CronJob 도 사라진다
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
