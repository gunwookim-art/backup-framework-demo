# 정책 파일 하나 = Application 하나.
#
# 핵심은 CI 가 렌더 결과를 Git 에 되쓰지 않는다는 점이다.
# Argo CD 가 정책 파일을 Helm values 로 직접 읽어 CronJob 을 만든다.
#
#   policies/orders.yaml  ──발견──▶  Application backup-orders
#                                        │ helm template
#                                        ▼
#                          judgement: backup 항목마다 CronJob
#
# 정책 파일이 없으면 Application 도 없다 → 미등록 서비스가 배포 화면에서도 보인다.

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: backup-policies
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/example/backup-framework-demo
        revision: main
        files:
          - path: "policies/*.yaml"

  template:
    metadata:
      name: "backup-{{ service }}"        # 정책 파일의 service 필드
    spec:
      project: backup
      source:
        repoURL: https://github.com/example/backup-framework-demo
        targetRevision: main
        path: charts/backup-runner
        helm:
          valueFiles:
            - "../../{{ path }}"          # 정책 파일이 곧 values
      destination:
        server: https://kubernetes.default.svc
        namespace: backup-system
      syncPolicy:
        automated:
          prune: true                     # 정책 파일을 지우면 CronJob 도 사라진다
          selfHeal: true
