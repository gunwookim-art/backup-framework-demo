# 저장소 목록. 인프라팀이 관리한다.
# 정책 파일은 여기 적힌 "이름"만 쓴다 — backend://local-primary/...
# 저장소를 옮기면 이 파일 한 줄과 데이터 이동으로 끝나고, 정책 파일은 건드리지 않는다.

backends:
  local-primary:
    type: local
    root: demo-state/artifacts/primary
    fault_domain: host-a          # 원본과 같은 도메인이면 경고
    write_protection: none

  local-offsite:
    type: local
    root: demo-state/artifacts/offsite
    fault_domain: host-b
    write_protection: versioning

  object-store:
    type: s3
    enabled: false                # 데모에서는 사용하지 않음
    endpoint: https://s3.example.com
    bucket: backups
    prefix: v2/
    fault_domain: region-b

# 실행 결과 기록을 둘 곳. 반드시 하나.
#  - 산출물 저장소와 분리한다. 산출물이 사라져도 "무엇이 있었는지"는 남아야 한다.
#  - 흩어지면 전체 현황을 만들 때 모든 저장소를 뒤져야 하고, 한 곳이 죽으면 현황이 불완전해진다.
results:
  backend: local-offsite
  prefix: results
